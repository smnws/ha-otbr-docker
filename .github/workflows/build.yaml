name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yaml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch_slug: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set normalized image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Build local image for smoke tests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ha-otbr-docker:smoke-${{ matrix.arch_slug }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch_slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_slug }}

      - name: Run container smoke checks
        run: ./tests/smoke_container.sh "ha-otbr-docker:smoke-${{ matrix.arch_slug }}" "${{ matrix.platform }}"

      - name: Push per-arch image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch_slug }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: ${DIGEST}" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Set normalized image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          tags=()
          short_sha="sha-${GITHUB_SHA::7}"
          tags+=("-t" "${IMAGE}:${short_sha}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=("-t" "${IMAGE}:latest")
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_name="${GITHUB_REF#refs/tags/}"
            tags+=("-t" "${IMAGE}:${tag_name}")
          fi

          sources=()
          for f in /tmp/digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "${f}")")
          done

          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "Expected 2 architecture digests, found ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
