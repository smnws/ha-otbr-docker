name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --no-cache-dir pytest

      - name: Check upstream drift
        run: python3 scripts/upstream_pins.py check

      - name: Dry-run patches against pinned commits
        run: python3 scripts/upstream_pins.py patch-check

      - name: Run shellcheck
        run: |
          shellcheck -x \
            build/*.sh \
            rootfs/usr/local/lib/otbr/*.sh \
            rootfs/etc/s6-overlay/scripts/*.sh \
            rootfs/etc/s6-overlay/s6-rc.d/*/run \
            rootfs/etc/s6-overlay/s6-rc.d/*/finish \
            rootfs/etc/s6-overlay/s6-rc.d/*/data/check \
            tests/*.sh

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Run unit tests
        run: |
          pytest -v tests/
          ./tests/test_firewall.sh
          ./tests/test_apply_patches.sh

  docker-smoke:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: otbr-ha:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Run container smoke checks
        run: ./tests/smoke_container.sh otbr-ha:ci
