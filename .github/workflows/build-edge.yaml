name: Build Edge (Latest Upstream OTBR)

on:
  workflow_dispatch:
    inputs:
      otbr_ref:
        description: "Upstream openthread/ot-br-posix branch, tag, or commit SHA"
        required: true
        default: "main"
        type: string
      publish:
        description: "Publish multi-arch :edge image to GHCR"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: build-edge
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      otbr_sha: ${{ steps.resolve.outputs.otbr_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Resolve upstream ot-br-posix commit
        id: resolve
        env:
          OTBR_REF: ${{ inputs.otbr_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${OTBR_REF}" =~ ^[A-Za-z0-9._/-]+$ || "${OTBR_REF}" == -* || "${OTBR_REF}" == *".."* ]]; then
            echo "Invalid otbr_ref: ${OTBR_REF}" >&2
            exit 1
          fi

          if [[ "${OTBR_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            sha="${OTBR_REF}"
          else
            sha="$(
              git ls-remote https://github.com/openthread/ot-br-posix.git \
                "refs/heads/${OTBR_REF}" "refs/tags/${OTBR_REF}^{}" "refs/tags/${OTBR_REF}" "${OTBR_REF}" \
                | awk 'NR == 1 { print $1 }'
            )"
          fi

          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Failed to resolve upstream ot-br-posix ref '${OTBR_REF}' to a 40-char commit SHA" >&2
            exit 1
          fi

          echo "Resolved ${OTBR_REF} -> ${sha}"
          echo "otbr_sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${sha::7}" >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch_slug: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ inputs.publish }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set normalized image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Build local edge image for smoke tests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ha-otbr-docker:edge-${{ matrix.arch_slug }}
          build-args: |
            OTBR_VERSION=${{ needs.resolve.outputs.otbr_sha }}
            OTBR_BETA_VERSION=${{ needs.resolve.outputs.otbr_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=edge-${{ needs.resolve.outputs.short_sha }}
          cache-from: type=gha,scope=edge-${{ matrix.arch_slug }}
          cache-to: type=gha,mode=max,scope=edge-${{ matrix.arch_slug }}

      - name: Run container smoke checks
        run: ./tests/smoke_container.sh "ha-otbr-docker:edge-${{ matrix.arch_slug }}" "${{ matrix.platform }}"

      - name: Push per-arch edge image by digest
        id: push
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            OTBR_VERSION=${{ needs.resolve.outputs.otbr_sha }}
            OTBR_BETA_VERSION=${{ needs.resolve.outputs.otbr_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=edge-${{ needs.resolve.outputs.short_sha }}
          cache-from: type=gha,scope=edge-${{ matrix.arch_slug }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        if: ${{ inputs.publish }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: ${DIGEST}" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.publish }}
        with:
          name: edge-digests-${{ matrix.arch_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    needs: [resolve, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: edge-digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Set normalized image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Create and push multi-arch edge manifest
        env:
          SHORT_OTBR_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          sources=()
          for f in /tmp/digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "${f}")")
          done

          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "Expected 2 architecture digests, found ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create \
            -t "${IMAGE}:edge" \
            -t "${IMAGE}:edge-${SHORT_OTBR_SHA}" \
            "${sources[@]}"
